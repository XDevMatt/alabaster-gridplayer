site_name: GridPlayer Alabaster
site_description: Multi-cell video grid player, built on GridPlayer 0.5.5
repo_url: https://github.com/XDevMatt/alabaster-gridplayer
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# Pages that stay in docs/ and still build, but are not in the navigation.
not_in_nav: |
  /roadmap.md
  /RELEASE-CHECKLIST.md
  /engine-vlc-vs-mpv.md
  /plugins/

validation:
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info

nav:
  - Home: index.md
  - Install on Windows: install.md
  - Quick start: quick-start.md
  - User guide (full, one page): USER-GUIDE.md
  - Topics:
      - user-guide/index.md
      - The grid and cells:
          - The grid: user-guide/grid.md
          - New cells: user-guide/new-cells.md
          - Mouse and side buttons: user-guide/mouse.md
          - Per-cell settings: user-guide/profiles.md
      - Files, folders and lists:
          - Dropping folders: user-guide/folder-drop.md
          - Folders: user-guide/folders.md
          - Moving between files: user-guide/navigation.md
          - Skip files open elsewhere: user-guide/skip-open.md
          - Lists: user-guide/lists.md
          - Playlists and snapshots: user-guide/playlists.md
          - Pictures: user-guide/pictures.md
          - Keep: user-guide/keep.md
      - Picture and sound:
          - Aspect filter: user-guide/aspect-filter.md
          - Rotate to fit: user-guide/rotate-to-fit.md
          - Zoom, crop and picture: user-guide/picture.md
          - Volume: user-guide/volume.md
          - Audio: user-guide/audio.md
          - Subtitles: user-guide/subtitles.md
      - Playback:
          - Loops: user-guide/loops.md
          - Seeking, chapters, bookmarks and sync: user-guide/seeking.md
          - Streaming: user-guide/streaming.md
      - Window, tray and command line: user-guide/window.md
  - Plugins and streaming: PLUGINS-AND-STREAMING.md
  - Reference:
      - Keyboard and mouse shortcuts: reference/keyboard-shortcuts.md
      - Hotkeys by task: reference/hotkeys-by-task.md
      - Hotkeys (generated table): reference/hotkeys.md
      - Settings overview: reference/settings-overview.md
      - Settings (full): reference/settings.md
      - Settings reference: reference/settings-reference.md
      - Configuration and files: reference/configuration.md
      - Data folder and portable mode: reference/data-folder.md
      - Where things are stored: reference/storage.md
  - Known limitations: KNOWN-LIMITATIONS.md
  - Future features: FUTURE.md
  - Platforms: platforms.md
  - FAQ and troubleshooting: faq.md
  - Building from source: building.md
  - Changelog: changelog.md
